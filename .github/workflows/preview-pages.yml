name: Publish review preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Lane marker for the review copy; leave blank for the clean replacement.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --lockfile=false
      - name: Capture the digest page
        env:
          LANE_ID: lane-07
          LANE_MARKER: ${{ inputs.lane_marker }}
        run: pnpm preview:capture -- "$RUNNER_TEMP/preview/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
